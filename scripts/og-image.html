<!doctype html>
<!--
	Source for public/og-image.png, the default social share image (1200×630). Regenerate after editing:
	  npx -y playwright@1.63.0 screenshot --channel chrome --viewport-size "1200,630" --wait-for-timeout 1500 \
	    "file://$PWD/scripts/og-image.html" public/og-image.png
	Colors and fonts follow src/styles/main.scss (light theme).
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Vollkorn:wght@600&display=block"
			rel="stylesheet"
		/>
		<style>
			html,
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
			}

			body {
				box-sizing: border-box;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding: 0 112px;
				background: linear-gradient(180deg, #ffffff 0%, hsl(193, 32%, 91%) 100%);
				color: hsl(0, 0%, 27%);
				font-family: 'Open Sans', sans-serif;
			}

			h1 {
				margin: 0;
				color: hsl(0, 0%, 20%);
				font-family: 'Vollkorn', serif;
				font-size: 112px;
				font-weight: 600;
				letter-spacing: -0.03em;
				line-height: 1.05;
			}

			p {
				margin: 28px 0 0;
				font-size: 44px;
			}

			.url {
				position: absolute;
				bottom: 64px;
				left: 112px;
				color: hsl(216, 14%, 48%);
				font-size: 28px;
			}
		</style>
	</head>
	<body>
		<h1>Victor Foster</h1>
		<p>UI Engineer</p>
		<div class="url">victorfoster.dev</div>
	</body>
</html>
